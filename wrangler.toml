name = "timeium"
compatibility_date = "2024-10-01"
main = "worker.js"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

# Override via: wrangler secret put SUPABASE_URL (etc.) — or set here as vars for
# values that are safe to expose (the anon key is public, URL is public).
[vars]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
