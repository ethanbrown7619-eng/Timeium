name = "temporium"
# No account_id committed (removed 2026-08-05). Git-connected Workers Builds
# supply the account from the connection; the break-glass GitHub Action takes
# it from the CLOUDFLARE_ACCOUNT_ID secret; a local `wrangler deploy` infers
# it from your `wrangler login` (it prompts if your login spans accounts).
compatibility_date = "2024-10-01"
main = "worker.js"
# Serve on the account's workers.dev subdomain. The recreated worker came
# up with no active routes and the dashboard's Enable toggle was greyed
# out — declaring it here makes every deploy enforce the route.
workers_dev = true

# Workers Logs: persist invocation logs + console output in the dashboard
# (Observability tab), so errors like the asset-serving 503s are visible
# after the fact instead of only via a live tail. 100% sampling — this
# app's request volume is tiny.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
not_found_handling = "single-page-application"
# REQUIRED for worker.js's env.ASSETS.fetch() fallthrough to work: the
# assets binding is only exposed to the worker when declared here. This
# was missing from day one — env.ASSETS was undefined — but the line was
# dead code while assets served worker-free, so it never showed. Turning
# run_worker_first on routed every page through the worker and the
# undefined binding 503'd the whole site.
binding = "ASSETS"
# NOTE: run_worker_first is intentionally OFF. Static assets are served
# directly by Cloudflare, bypassing the worker — exactly as they were
# before the perf work. Turning it on routed every HTML/JS/CSS response
# through the worker, which surfaced a 304-handling bug and 503'd the
# whole site. All the perceived-speed upgrades are client-side (vendored
# supabase-js, modulepreload, skeletons, toasts), so they don't need the
# worker in the asset path. Not worth the outage risk for header coverage.

# Override via: wrangler secret put SUPABASE_URL (etc.) — or set here as vars for
# values that are safe to expose (the anon key is public, URL is public).
[vars]
SUPABASE_URL = "https://kyfydyownbgwhquorchn.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5ZnlkeW93bmJnd2hxdW9yY2huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzYyNDQsImV4cCI6MjA5MTYxMjI0NH0.BqsGiVxhtSqWRnqVM_w1dIDu0tDuzv9Xrg6a3NRUTxM"

# Cloudflare Turnstile public site key. Safe to commit — it's the
# public-facing identifier; the matching secret key lives in Supabase
# Auth's CAPTCHA settings. Leave blank to disable the widget.
TURNSTILE_SITE_KEY = "0x4AAAAAAEFhSpbPy4xVI7Da"

# Secrets (set via `wrangler secret put NAME`, never committed):
#
#   SUPABASE_SERVICE_ROLE_KEY
#     Used only by the Xero integration routes (/xero/*) to read/write the
#     xero_connections table, which is locked down to service_role by RLS.
#     All other Supabase queries from the Worker still use the anon key +
#     user JWT.
#
#   XERO_CLIENT_ID
#     From the Xero developer portal app — "PTL Timesheet Integration".
#
#   XERO_CLIENT_SECRET
#     The matching secret. Rotate via the Xero dev portal if compromised.
