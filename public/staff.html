<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff · Temporium</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <div class="tabs">
        <button class="tab active" data-tab="employees">Employees</button>
        <button class="tab" data-tab="org">Organisation</button>
      </div>

      <!-- ============================================================ -->
      <!-- Employees tab                                                -->
      <!-- ============================================================ -->
      <section id="tab-employees" class="tab-panel">
        <div class="card">
          <div class="row-flex mb-md">
            <button id="add-employee-btn">+ Add employee</button>
            <input id="search-input" placeholder="Search name, email, code…" style="width:260px" />
            <label class="row-flex small muted" style="gap:4px">
              <input type="checkbox" id="show-inactive" /> Show inactive
            </label>
            <label class="row-flex small muted" style="gap:4px">
              <input type="checkbox" id="only-incomplete" /> Only incomplete
            </label>
            <div class="grow"></div>
            <span id="staff-summary" class="muted small"></span>
          </div>

          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Type</th>
                  <th>Code</th>
                  <th class="num">Cost $/hr</th>
                  <th class="num">Sell $/hr</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="staff-body">
                <tr><td colspan="9" class="muted small" style="text-align:center">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- Organisation tab                                             -->
      <!-- ============================================================ -->
      <section id="tab-org" class="tab-panel" style="display:none">
        <div class="card">
          <div class="row-flex mb-md">
            <div class="tabs sub">
              <button class="tab active" data-org-view="columns">Departments view</button>
              <button class="tab" data-org-view="tree">Reporting tree</button>
            </div>
            <div class="grow"></div>
            <span class="muted small">
              Drag employee cards between departments to reassign them. Set
              each department's manager from its header dropdown.
            </span>
          </div>

          <div id="org-columns" class="org-columns"></div>
          <div id="org-tree" class="org-tree" style="display:none"></div>
        </div>
      </section>
    </main>

    <!-- ============================================================ -->
    <!-- Add / Edit employee dialog                                    -->
    <!-- ============================================================ -->
    <dialog id="employee-dialog">
      <form id="employee-form" style="padding:20px;width:min(95vw,480px)">
        <h2 id="dialog-title" style="margin-top:0">Add employee</h2>

        <div class="mb-sm">
          <label for="f-name">Name *</label>
          <input id="f-name" required style="width:100%" />
        </div>
        <div class="mb-sm">
          <label for="f-email">Email</label>
          <input id="f-email" type="email" style="width:100%" />
        </div>
        <div class="row-flex mb-sm">
          <div class="grow">
            <label for="f-department">Department</label>
            <select id="f-department" style="width:100%"></select>
          </div>
          <div class="grow">
            <label for="f-employment">Employment type</label>
            <select id="f-employment" style="width:100%">
              <option value="waged">Waged</option>
              <option value="salaried">Salaried</option>
              <option value="contractor">Contractor</option>
            </select>
          </div>
        </div>
        <div class="row-flex mb-sm">
          <div class="grow">
            <label for="f-code">Employee code</label>
            <input id="f-code" style="width:100%" />
          </div>
          <div class="grow">
            <label for="f-ot">Overtime threshold (h/wk)</label>
            <input id="f-ot" type="number" step="0.5" min="0" max="168" style="width:100%" />
          </div>
        </div>
        <div class="row-flex mb-md">
          <div class="grow">
            <label for="f-cost">Cost rate $/hr</label>
            <input id="f-cost" type="number" step="0.01" min="0" style="width:100%" />
          </div>
          <div class="grow">
            <label for="f-sell">Sell rate $/hr</label>
            <input id="f-sell" type="number" step="0.01" min="0" style="width:100%" />
          </div>
        </div>

        <div class="row-flex mt-md">
          <button type="button" class="ghost" id="cancel-edit">Cancel</button>
          <div class="grow"></div>
          <button type="button" class="danger hidden" id="deactivate-btn">Deactivate</button>
          <button type="submit" id="save-btn">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/staff.js"></script>
  </body>
</html>
