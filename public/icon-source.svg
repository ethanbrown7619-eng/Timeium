<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed lime background. Maskable safe zone is the central circle
       of radius 0.4*1024 = 410px; both lines of text sit inside that. -->
  <rect width="1024" height="1024" fill="#c2ff00"/>
  <text x="512" y="560"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="380"
        letter-spacing="-22"
        fill="#0a0a0a">ptl</text>
  <text x="512" y="760"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="140"
        letter-spacing="-2"
        fill="#0a0a0a">Timesheet</text>
</svg>
