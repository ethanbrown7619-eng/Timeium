<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed lime background. Maskable safe zone is the central circle
       of radius 0.4*1024 = 410px; both lines of text sit inside that.
       The SVG references the same system font stack the rest of the app
       uses (-apple-system); when the static PNGs are pre-rasterised on
       Linux we install Inter to stand in for SF Pro / Segoe UI / Roboto. -->
  <rect width="1024" height="1024" fill="#BEFA40"/>
  <text x="512" y="560"
        text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="380"
        letter-spacing="-22"
        fill="#0a0a0a">ptl</text>
  <text x="512" y="760"
        text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="600"
        font-size="140"
        letter-spacing="-4"
        fill="#0a0a0a">Timesheet</text>
</svg>
