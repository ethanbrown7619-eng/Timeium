<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed lime background. The maskable "safe zone" is the central
       circle of radius 0.4*1024 = 410px; "ptl" is sized to fit inside that
       so iOS rounded corners / Android adaptive icons never crop it. -->
  <rect width="1024" height="1024" fill="#c2ff00"/>
  <text x="512" y="660"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="500"
        letter-spacing="-30"
        fill="#0a0a0a">ptl</text>
</svg>
