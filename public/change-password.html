<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c2ff00" />
    <title>Set Password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <span class="brand-logo">ptl</span>
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Set your password</h1>
        <p class="muted small mb-md">Your account is using the default password. Please choose a new one.</p>
        <div id="notice" class="notice hidden"></div>

        <form id="change-form">
          <div class="mb-sm">
            <label for="password">New password</label>
            <input id="password" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="submit-btn">Set password</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { notice, routeAfterAuth, validatePassword } from "/js/shared.js";

      const sb = await getSupabase();

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        location.replace("/signin.html");
        throw new Error("not signed in");
      }

      document.getElementById("change-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        const btn = document.getElementById("submit-btn");

        if (pw !== confirm) {
          notice("Passwords do not match", "error");
          return;
        }
        const pwCheck = validatePassword(pw);
        if (!pwCheck.ok) {
          notice(pwCheck.reason, "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Saving…";

        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) {
          notice(error.message || "Failed to update password", "error");
          btn.disabled = false;
          btn.textContent = "Set password";
          return;
        }

        // Clear the must_change_password flag
        const { data: me } = await sb
          .from("users")
          .select("id")
          .eq("auth_user_id", session.user.id)
          .maybeSingle();
        if (me) {
          await sb.from("users").update({ must_change_password: false }).eq("id", me.id);
        }

        notice("Password updated", "success");
        setTimeout(() => routeAfterAuth(sb), 500);
      });
    </script>
  </body>
</html>
