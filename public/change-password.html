<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c2ff00" />
    <title>Set Password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <span class="brand-logo">ptl</span>
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Set your password</h1>
        <p class="muted small mb-md">Your account is using the default password. Please choose a new one.</p>
        <div id="notice" class="notice hidden"></div>

        <form id="change-form">
          <div class="mb-sm">
            <label for="password">New password</label>
            <input id="password" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="submit-btn">Set password</button>
        </form>
      </div>
    </div>

    <script type="module" src="/js/change-password.js"></script>
  </body>
</html>
