<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Archive · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <div class="card">
        <h2 style="margin-top:0">Timesheet Archive</h2>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Week starting</th>
                <th>Status</th>
                <th class="num">Total hours</th>
                <th>Submitted</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="archive-body">
              <tr><td colspan="5" class="muted small" style="text-align:center">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/archive.js"></script>
  </body>
</html>
