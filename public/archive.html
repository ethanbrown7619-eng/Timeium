<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive · Timeium</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="topbar" class="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>
      <div class="card">
        <h2>Archived timesheets</h2>
        <p class="muted small">All the timesheets you've submitted, most-recent first.</p>
        <table id="archive-table">
          <thead>
            <tr>
              <th>Week starting</th>
              <th class="num">Regular</th>
              <th class="num">Overtime</th>
              <th class="num">Total</th>
              <th>Status</th>
              <th>Submitted</th>
              <th>Approved</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="archive-body">
            <tr><td colspan="8" class="muted small" style="text-align:center">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script type="module">
      import { requireAuth, renderTopbar, formatLongDate, escapeHtml } from "/js/shared.js";

      const ctx = await requireAuth({ requireEmployee: true });
      renderTopbar(ctx, "archive");

      const { data, error } = await ctx.supabase
        .from("timesheet_submissions")
        .select("*")
        .eq("user_id", ctx.employee.id)
        .order("week_start", { ascending: false });

      const body = document.getElementById("archive-body");
      if (error) {
        body.innerHTML = `<tr><td colspan="8" class="notice error">${escapeHtml(error.message)}</td></tr>`;
      } else if (!data || data.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="muted small" style="text-align:center">No timesheets yet.</td></tr>`;
      } else {
        body.innerHTML = data.map((s) => `
          <tr>
            <td>${formatLongDate(s.week_start)}</td>
            <td class="num">${Number(s.regular_hours).toFixed(2)}</td>
            <td class="num">${Number(s.overtime_hours).toFixed(2)}</td>
            <td class="num"><strong>${Number(s.total_hours).toFixed(2)}</strong></td>
            <td><span class="chip ${s.status}">${statusLabel(s.status)}</span></td>
            <td class="small muted">${s.submitted_at ? new Date(s.submitted_at).toLocaleString() : "—"}</td>
            <td class="small muted">${s.approved_at ? new Date(s.approved_at).toLocaleString() : "—"}</td>
            <td><a href="/timesheet.html?week=${s.week_start}" onclick="localStorage.setItem('ts_week','${s.week_start}')">View</a></td>
          </tr>
        `).join("");
      }

      function statusLabel(s) {
        return ({
          draft: "Draft",
          submitted: "Submitted",
          manager_approved: "Approved",
          rejected: "Rejected",
          paid: "Paid",
        })[s] || s;
      }
    </script>
  </body>
</html>
