<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <span class="brand-logo">ptl</span>
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Reset your password</h1>
        <p class="muted small mb-md">
          Enter the email address you use to sign in. We'll send you a link to
          choose a new password.
        </p>
        <div id="notice" class="notice hidden"></div>

        <form id="forgot-form">
          <div class="mb-md">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="submit-btn">Send reset link</button>
        </form>

        <p class="small" style="margin:16px 0 0;text-align:center">
          <a href="/signin.html">Back to sign in</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { notice } from "/js/shared.js";

      const sb = await getSupabase();

      document.getElementById("forgot-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const btn = document.getElementById("submit-btn");

        if (!email) return notice("Enter your email address", "error");

        btn.disabled = true;
        btn.textContent = "Sending…";

        const redirectTo = `${location.origin}/reset-password.html`;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

        if (error) {
          notice(error.message || "Failed to send reset email", "error");
          btn.disabled = false;
          btn.textContent = "Send reset link";
          return;
        }

        // Always show success (don't leak whether email exists)
        document.getElementById("forgot-form").style.display = "none";
        notice(
          "If an account exists for that email, a password reset link has been sent. Check your inbox.",
          "success"
        );
      });
    </script>
  </body>
</html>
