<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Reset password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <img src="/img/ptl-logo.png" class="brand-logo" alt="PTL" />
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Reset your password</h1>
        <p class="muted small mb-md">
          Enter the email address you use to sign in. We'll send you a link to
          choose a new password.
        </p>
        <div id="notice" class="notice hidden"></div>

        <form id="forgot-form">
          <div class="mb-md">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" style="width:100%" />
          </div>
          <div id="turnstile-container" class="mb-sm"></div>
          <button type="submit" style="width:100%" id="submit-btn">Send reset link</button>
        </form>

        <p class="small" style="margin:16px 0 0;text-align:center">
          <a href="/signin.html">Back to sign in</a>
        </p>
      </div>
    </div>

    <script type="module" src="/js/forgot-password.js"></script>
  </body>
</html>
