<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Reset password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://kyfydyownbgwhquorchn.supabase.co" crossorigin />
    <link rel="modulepreload" href="/js/forgot-password.js" />
    <link rel="modulepreload" href="/js/shared.js" />
    <link rel="modulepreload" href="/js/supabase-client.js" />
    <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
    <link rel="modulepreload" href="/js/turnstile.js" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <img src="/img/ptl-logo.png" class="brand-logo" alt="PTL" />
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Reset your password</h1>
        <p class="muted small mb-md" id="intro-text">
          Enter the email address you use to sign in. We'll email you a 6-digit
          code to choose a new password.
        </p>
        <div id="notice" class="notice hidden"></div>

        <form id="forgot-form">
          <div class="mb-md">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" style="width:100%" />
          </div>
          <div id="turnstile-container" class="mb-sm"></div>
          <button type="submit" style="width:100%" id="submit-btn">Email me a code</button>
        </form>

        <form id="code-form" class="hidden">
          <div class="mb-md">
            <label for="code">6-digit code</label>
            <input id="code" type="text" required inputmode="numeric" pattern="\d{6}"
              maxlength="6" autocomplete="one-time-code" placeholder="123456" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="verify-btn">Verify code</button>
          <p class="small muted" style="margin:12px 0 0;text-align:center">
            Codes can take a few minutes to arrive. Always use the newest email —
            requesting again cancels earlier codes.
            <a href="/forgot-password.html">Send a new code</a>
          </p>
        </form>

        <p class="small" style="margin:16px 0 0;text-align:center">
          <a href="/signin.html">Back to sign in</a>
        </p>
      </div>
    </div>

    <script type="module" src="/js/forgot-password.js"></script>
  </body>
</html>
