<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Departments · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">      <div class="brand">        <span class="brand-logo" aria-hidden="true">ptl</span>        <span class="brand-name">Timesheet</span>      </div>      <nav></nav>      <div class="grow"></div>    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 4px" id="page-title">My Departments</h2>
      <p class="muted mb-md" id="mgr-week-label"></p>

      <div class="dash-charts" id="dept-donuts"></div>

      <div class="card" id="leave-requests-card" style="display:none">
        <h3 style="margin:0 0 12px">Pending Leave Requests</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Type</th>
                <th>Dates</th>
                <th class="num">Hours/day</th>
                <th>Reason</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="pending-leave-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px" id="emp-table-title">Employees</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Status</th>
                <th>Hours</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="mgr-emp-body">
              <tr><td colspan="5" class="muted small" style="text-align:center">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/department.js"></script>
  </body>
</html>
