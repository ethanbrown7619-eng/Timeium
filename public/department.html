<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Department · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">      <div class="brand">        <span class="brand-logo" aria-hidden="true">ptl</span>        <span class="brand-name">Timesheet</span>      </div>      <nav></nav>      <div class="grow"></div>    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 4px">My Department</h2>
      <p class="muted mb-md" id="mgr-week-label"></p>

      <div class="dash-charts" style="justify-content:flex-start">
        <div class="card dash-chart-card">
          <h3 style="margin:0 0 12px;text-align:center">Timesheets Submitted</h3>
          <div class="donut-wrap" id="mgr-donut"></div>
          <div id="mgr-legend" class="dash-legend"></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px">My Employees</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Status</th>
                <th>Hours</th>
              </tr>
            </thead>
            <tbody id="mgr-emp-body">
              <tr><td colspan="4" class="muted small" style="text-align:center">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/department.js"></script>
  </body>
</html>
