<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Approvals · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://kyfydyownbgwhquorchn.supabase.co" crossorigin />
    <link rel="modulepreload" href="/js/department.js" />
    <link rel="modulepreload" href="/js/shared.js" />
    <link rel="modulepreload" href="/js/supabase-client.js" />
    <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 4px" id="page-title">Approvals</h2>
      <div class="row-flex mb-md">
        <button class="ghost" id="dept-prev">←</button>
        <h3 id="mgr-week-label" style="margin:0;min-width:240px;text-align:center"></h3>
        <button class="ghost" id="dept-next">→</button>
      </div>

      <div class="dash-charts" id="dept-donuts"></div>

      <div class="card">
        <h3 style="margin:0 0 12px" id="emp-table-title">Employees</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Status</th>
                <th>Hours</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="mgr-emp-body">
              <tr class="skel-row"><td colspan="5"><span class="skel"></span></td></tr><tr class="skel-row"><td colspan="5"><span class="skel"></span></td></tr><tr class="skel-row"><td colspan="5"><span class="skel"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/department.js"></script>
  </body>
</html>
