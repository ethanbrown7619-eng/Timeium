<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>My Departments · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 4px" id="page-title">My Departments</h2>
      <div class="row-flex mb-md">
        <button class="ghost" id="dept-prev">←</button>
        <h3 id="mgr-week-label" style="margin:0;min-width:240px;text-align:center"></h3>
        <button class="ghost" id="dept-next">→</button>
      </div>

      <div class="dash-charts" id="dept-donuts"></div>

      <div class="card" id="leave-requests-card" style="display:none">
        <h3 style="margin:0 0 12px">Pending Leave Requests</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Type</th>
                <th>Dates</th>
                <th class="num">Hours/day</th>
                <th>Reason</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="pending-leave-body"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="approved-leave-card" style="display:none">
        <h3 style="margin:0 0 12px">Approved Leave</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Type</th>
                <th>Dates</th>
                <th class="num">Hours/day</th>
                <th>Reason</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="approved-leave-body"></tbody>
          </table>
        </div>
      </div>

      <dialog id="edit-leave-dialog">
        <form id="edit-leave-form" style="padding:20px;width:min(95vw,420px)">
          <h2 style="margin-top:0">Edit approved leave</h2>

          <div class="mb-sm">
            <label for="el-type">Leave type</label>
            <select id="el-type" required style="width:100%"></select>
          </div>

          <div class="row-flex mb-sm">
            <div class="grow">
              <label for="el-start">Start date</label>
              <input id="el-start" type="date" required style="width:100%" />
            </div>
            <div class="grow">
              <label for="el-end">End date</label>
              <input id="el-end" type="date" required style="width:100%" />
            </div>
          </div>

          <div class="mb-sm">
            <label for="el-hours">Hours per day</label>
            <input id="el-hours" type="number" step="0.25" min="0" max="24" required style="width:100%" />
          </div>

          <div class="mb-sm">
            <label class="row-flex" style="gap:8px;cursor:pointer">
              <input type="checkbox" id="el-skip-weekends" />
              <span>Skip weekends</span>
            </label>
          </div>

          <div class="mb-md">
            <label for="el-reason">Reason</label>
            <input id="el-reason" style="width:100%" />
          </div>

          <div class="row-flex mt-md">
            <button type="button" class="ghost" id="el-cancel">Cancel</button>
            <div class="grow"></div>
            <button type="submit" id="el-submit">Save changes</button>
          </div>
        </form>
      </dialog>

      <div class="card">
        <h3 style="margin:0 0 12px" id="emp-table-title">Employees</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Status</th>
                <th>Hours</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="mgr-emp-body">
              <tr><td colspan="5" class="muted small" style="text-align:center">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/department.js"></script>
  </body>
</html>
