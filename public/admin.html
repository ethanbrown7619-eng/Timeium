<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">      <div class="brand">        <span class="brand-logo" aria-hidden="true">ptl</span>        <span class="brand-name">Timesheet</span>      </div>      <nav>        <a href="/timesheet.html">My Timesheets</a>        <a href="/staff.html">Staff</a>        <a href="/configure.html">Configure</a>        <a href="/admin.html" class="active">Admin</a>      </nav>      <div class="grow"></div>    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 4px">Admin Dashboard</h2>
      <p class="muted mb-md" id="week-label"></p>

      <div class="dash-charts">
        <div class="card dash-chart-card">
          <h3 style="margin:0 0 12px;text-align:center">Departments Submitted</h3>
          <div class="donut-wrap" id="dept-donut"></div>
          <div id="dept-legend" class="dash-legend"></div>
        </div>
        <div class="card dash-chart-card">
          <h3 style="margin:0 0 12px;text-align:center">Employees Submitted</h3>
          <div class="donut-wrap" id="emp-donut"></div>
          <div id="emp-legend" class="dash-legend"></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px">All Employees</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Department</th>
                <th>Status</th>
                <th>Hours</th>
              </tr>
            </thead>
            <tbody id="emp-body">
              <tr><td colspan="4" class="muted small" style="text-align:center">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
