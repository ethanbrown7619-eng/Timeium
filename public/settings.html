<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c2ff00" />
    <title>Settings · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 16px">My Settings</h2>

      <div class="card" style="max-width:480px">
        <h3 style="margin:0 0 12px">Account</h3>
        <p class="muted small" style="margin:0 0 4px">Signed in as</p>
        <p style="margin:0 0 16px"><strong id="me-email"></strong></p>

        <p class="muted small" style="margin:0 0 4px">Name</p>
        <p style="margin:0 0 8px"><strong id="me-name">—</strong></p>
      </div>

      <div class="card" style="max-width:480px">
        <h3 style="margin:0 0 12px">Change password</h3>
        <form id="pw-form">
          <div class="mb-sm">
            <label for="current-pw">Current password</label>
            <input id="current-pw" type="password" required autocomplete="current-password" style="width:100%" />
          </div>
          <div class="mb-sm">
            <label for="new-pw">New password</label>
            <input id="new-pw" type="password" required minlength="12" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm-pw">Confirm new password</label>
            <input id="confirm-pw" type="password" required minlength="12" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" id="pw-btn">Update password</button>
          <span id="pw-status" class="muted small" style="margin-left:12px"></span>
        </form>
        <p class="small" style="margin:12px 0 0">
          <a href="/forgot-password.html">Forgot your password?</a>
        </p>
      </div>
    </main>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { notice, renderTopbar, escapeHtml, getUserContext, validatePassword, MIN_PASSWORD_LENGTH } from "/js/shared.js";

      const sb = await getSupabase();

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        location.replace("/signin.html");
        throw new Error("not signed in");
      }

      const ctx = await getUserContext(sb, session);
      const { isDeveloper, adminRow, isManager, employee: me } = ctx;

      renderTopbar({
        sb,
        session,
        isDeveloper,
        isManager,
        adminRow,
        orgs: null,
        currentOrgId: adminRow?.organisation_id || null,
        onOrgChange: () => {},
        active: "settings",
      });

      document.getElementById("me-email").textContent = session.user.email || "";
      document.getElementById("me-name").textContent = me?.name || session.user.email || "";

      document.getElementById("pw-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const currentPw = document.getElementById("current-pw").value;
        const pw = document.getElementById("new-pw").value;
        const confirm = document.getElementById("confirm-pw").value;
        const btn = document.getElementById("pw-btn");
        const statusEl = document.getElementById("pw-status");

        if (!currentPw) return notice("Enter your current password", "error");
        if (pw !== confirm) return notice("New passwords do not match", "error");
        const pwCheck = validatePassword(pw);
        if (!pwCheck.ok) return notice(pwCheck.reason, "error");
        if (pw === currentPw) return notice("New password must be different from current", "error");

        btn.disabled = true;
        statusEl.textContent = "Verifying…";

        // Verify the current password by re-authenticating
        const email = session.user.email;
        const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: currentPw });
        if (signInErr) {
          statusEl.textContent = "";
          btn.disabled = false;
          return notice("Current password is incorrect", "error");
        }

        statusEl.textContent = "Saving…";
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) {
          statusEl.textContent = "";
          btn.disabled = false;
          return notice(error.message || "Failed to update password", "error");
        }

        if (me?.id) {
          await sb.from("users").update({ must_change_password: false }).eq("id", me.id);
        }

        document.getElementById("current-pw").value = "";
        document.getElementById("new-pw").value = "";
        document.getElementById("confirm-pw").value = "";
        statusEl.textContent = "Saved";
        btn.disabled = false;
        notice("Password updated", "success");
        setTimeout(() => statusEl.textContent = "", 3000);
      });
    </script>
  </body>
</html>
