<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Settings · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <h2 style="margin:0 0 16px">My Settings</h2>

      <div class="card" style="max-width:480px">
        <h3 style="margin:0 0 12px">Account</h3>
        <p class="muted small" style="margin:0 0 4px">Signed in as</p>
        <p style="margin:0 0 16px"><strong id="me-email"></strong></p>

        <p class="muted small" style="margin:0 0 4px">Name</p>
        <p style="margin:0 0 8px"><strong id="me-name">—</strong></p>
      </div>

      <div class="card" style="max-width:480px">
        <h3 style="margin:0 0 12px">Change password</h3>
        <form id="pw-form">
          <div class="mb-sm">
            <label for="current-pw">Current password</label>
            <input id="current-pw" type="password" required autocomplete="current-password" style="width:100%" />
          </div>
          <div class="mb-sm">
            <label for="new-pw">New password</label>
            <input id="new-pw" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm-pw">Confirm new password</label>
            <input id="confirm-pw" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" id="pw-btn">Update password</button>
          <span id="pw-status" class="muted small" style="margin-left:12px"></span>
        </form>
        <p class="small" style="margin:12px 0 0">
          <a href="/forgot-password.html">Forgot your password?</a>
        </p>
      </div>
    </main>

    <script type="module" src="/js/settings.js"></script>
  </body>
</html>
