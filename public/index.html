<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendium</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <script type="module">
      // Attendium Phase 1 owns /signup.html and /admin.html. This app (the
      // timesheet module) currently only ships the admin Departments UI, so
      // unauthenticated visitors go to signup and authenticated ones go to
      // admin.
      import { getSupabase } from "/js/supabase-client.js";
      const sb = await getSupabase();
      const { data: { session } } = await sb.auth.getSession();
      location.replace(session ? "/admin.html" : "/signup.html");
    </script>
  </body>
</html>
