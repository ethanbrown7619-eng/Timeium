<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Choose new password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://kyfydyownbgwhquorchn.supabase.co" crossorigin />
    <link rel="modulepreload" href="/js/reset-password.js" />
    <link rel="modulepreload" href="/js/shared.js" />
    <link rel="modulepreload" href="/js/supabase-client.js" />
    <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <img src="/img/ptl-logo.png" class="brand-logo" alt="PTL" />
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Choose a new password</h1>
        <div id="notice" class="notice hidden"></div>

        <div id="no-session" class="hidden">
          <p class="muted">
            This password reset link has expired or is invalid. Please
            <a href="/forgot-password.html">request a new one</a>.
          </p>
        </div>

        <form id="reset-form" class="hidden">
          <div class="mb-sm">
            <label for="password">New password</label>
            <input id="password" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" required minlength="8" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="submit-btn">Set new password</button>
        </form>
      </div>
    </div>

    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
