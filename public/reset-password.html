<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Choose new password · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <span class="brand-logo">ptl</span>
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Choose a new password</h1>
        <div id="notice" class="notice hidden"></div>

        <div id="no-session" class="hidden">
          <p class="muted">
            This password reset link has expired or is invalid. Please
            <a href="/forgot-password.html">request a new one</a>.
          </p>
        </div>

        <form id="reset-form" class="hidden">
          <div class="mb-sm">
            <label for="password">New password</label>
            <input id="password" type="password" required minlength="6" autocomplete="new-password" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" required minlength="6" autocomplete="new-password" style="width:100%" />
          </div>
          <button type="submit" style="width:100%" id="submit-btn">Set new password</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { notice, routeAfterAuth } from "/js/shared.js";

      const sb = await getSupabase();

      // Supabase parses the recovery token from the URL hash automatically
      // and fires a PASSWORD_RECOVERY event. Wait briefly, then check session.
      let isRecovery = false;
      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") isRecovery = true;
      });

      await new Promise((r) => setTimeout(r, 300));

      const { data: { session } } = await sb.auth.getSession();
      const form = document.getElementById("reset-form");
      const noSession = document.getElementById("no-session");

      if (!session) {
        noSession.classList.remove("hidden");
      } else {
        form.classList.remove("hidden");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        const btn = document.getElementById("submit-btn");

        if (pw !== confirm) return notice("Passwords do not match", "error");
        if (pw.length < 6) return notice("Password must be at least 6 characters", "error");

        btn.disabled = true;
        btn.textContent = "Saving…";

        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) {
          notice(error.message || "Failed to update password", "error");
          btn.disabled = false;
          btn.textContent = "Set new password";
          return;
        }

        // Clear the must_change_password flag if set
        try {
          const { data: { session: sess } } = await sb.auth.getSession();
          if (sess) {
            const { data: me } = await sb
              .from("users")
              .select("id")
              .eq("auth_user_id", sess.user.id)
              .maybeSingle();
            if (me) {
              await sb.from("users").update({ must_change_password: false }).eq("id", me.id);
            }
          }
        } catch {}

        notice("Password updated", "success");
        setTimeout(() => routeAfterAuth(sb), 500);
      });
    </script>
  </body>
</html>
