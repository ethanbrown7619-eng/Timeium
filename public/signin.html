<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Sign in · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <img src="/img/ptl-logo.png" class="brand-logo" alt="PTL" />
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Sign in</h1>
        <div id="notice" class="notice hidden"></div>

        <form id="signin-form">
          <div class="mb-sm">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" required autocomplete="current-password" style="width:100%" />
              <button type="button" id="toggle-password" class="password-toggle"
                      aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div id="turnstile-container" class="mb-sm" style="min-height:0"></div>
          <button type="submit" style="width:100%" id="submit-btn">Sign in</button>
        </form>

        <p class="small" style="margin:16px 0 0;text-align:center">
          <a href="/forgot-password.html">Forgot your password?</a>
        </p>
      </div>
    </div>

    <script type="module" src="/js/signin.js"></script>
  </body>
</html>
