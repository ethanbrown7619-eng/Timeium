<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c2ff00" />
    <title>Sign in · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-brand">
          <span class="brand-logo">ptl</span>
          <span class="brand-name">Timesheet</span>
        </div>
        <h1>Sign in</h1>
        <div id="notice" class="notice hidden"></div>

        <form id="signin-form">
          <div class="mb-sm">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" style="width:100%" />
          </div>
          <div class="mb-md">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" required autocomplete="current-password" style="width:100%" />
              <button type="button" id="toggle-password" class="password-toggle"
                      aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div id="turnstile-container" class="mb-sm" style="min-height:0"></div>
          <button type="submit" style="width:100%" id="submit-btn">Sign in</button>
        </form>

        <p class="small" style="margin:16px 0 0;text-align:center">
          <a href="/forgot-password.html">Forgot your password?</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { notice, routeAfterAuth } from "/js/shared.js";
      import { mountTurnstile } from "/js/turnstile.js";

      const sb = await getSupabase();
      const turnstile = await mountTurnstile(document.getElementById("turnstile-container"));

      // Surface the reason for an automatic sign-out (currently only the
      // 30-minute idle timeout from shared.js) so the next person doesn't
      // wonder why they're back at the login screen.
      try {
        const reason = sessionStorage.getItem("ptl-signout-reason");
        if (reason === "idle") {
          notice("Signed out automatically after 30 minutes of inactivity. Sign in again to continue.", "info");
        } else if (reason === "orphan") {
          notice("Your previous sign-in is no longer linked to an employee record. Please sign in with your own account.", "warn");
        }
        sessionStorage.removeItem("ptl-signout-reason");
      } catch { /* sessionStorage may be unavailable in private mode */ }

      // Show / hide password toggle. The button's aria-pressed state and
      // label flip in sync with the input type so screen readers stay
      // accurate.
      document.getElementById("toggle-password").addEventListener("click", (e) => {
        const input = document.getElementById("password");
        const btn = e.currentTarget;
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.setAttribute("aria-pressed", showing ? "false" : "true");
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      });

      // Already signed in? Bounce straight through.
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        await routeAfterAuth(sb);
      }

      document.getElementById("signin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "Signing in…";

        // Soft lockout: 5 failed attempts in 15 min blocks further tries.
        // Server-authoritative via check_login_locked RPC.
        const { data: locked } = await sb.rpc("check_login_locked", { p_email: email });
        if (locked) {
          notice("Too many failed sign-in attempts. Please wait 15 minutes and try again.", "error");
          btn.disabled = false;
          btn.textContent = "Sign in";
          return;
        }

        const captchaToken = await turnstile.getToken();
        const { data: signinData, error } = await sb.auth.signInWithPassword({
          email, password, options: { captchaToken },
        });

        // Audit every attempt (success or failure) for forensic review.
        // Fire-and-forget — UX shouldn't block on the audit write.
        sb.rpc("record_login_attempt", {
          p_email: email,
          p_succeeded: !error,
          p_failure_reason: error?.message || null,
          p_user_agent: navigator.userAgent || null,
        }).then(() => {}, () => {});

        if (error) {
          notice(error.message || "Sign in failed", "error");
          turnstile.reset();
          btn.disabled = false;
          btn.textContent = "Sign in";
          return;
        }

        // Check if this user must change their default password
        const sess = signinData?.session;
        if (sess) {
          const { data: me } = await sb
            .from("users")
            .select("must_change_password")
            .eq("auth_user_id", sess.user.id)
            .maybeSingle();
          if (me?.must_change_password) {
            location.replace("/change-password.html");
            return;
          }
        }

        await routeAfterAuth(sb);
      });
    </script>
  </body>
</html>
