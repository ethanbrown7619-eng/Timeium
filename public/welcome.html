<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">ptl</span>
        <span class="brand-name">Timesheet</span>
      </div>
      <div class="grow"></div>
      <div class="row-flex">
        <span id="whoami" class="who"></span>
        <a href="#" id="signout-link" class="muted">Sign out</a>
      </div>
    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <div class="card" id="unlinked-card" style="display:none">
        <h2>Almost there</h2>
        <p>
          Your account is signed in, but you're not on the employee roster
          yet. Ask your admin to add you to PTL Timesheet using the email
          <strong id="unlinked-email"></strong>, then refresh this page.
        </p>
        <button id="refresh-link" class="ghost">Try again</button>
      </div>
    </main>

    <script type="module">
      import { getSupabase } from "/js/supabase-client.js";
      import { escapeHtml } from "/js/shared.js";

      const sb = await getSupabase();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        location.replace("/signin.html");
      }

      document.getElementById("whoami").textContent = session.user.email || "";
      document.getElementById("signout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        await sb.auth.signOut();
        location.href = "/signin.html";
      });

      document.getElementById("refresh-link").addEventListener("click", async () => {
        let claim = null;
        try {
          const res = await sb.rpc("claim_employee_by_email");
          claim = res.data;
        } catch (err) {
          console.warn("claim retry failed", err);
        }
        if (claim?.claimed) {
          location.reload();
        } else {
          // Still no match.
          document.getElementById("unlinked-email").textContent = session.user.email || "your email";
        }
      });

      let claim = null;
      try {
        const res = await sb.rpc("claim_employee_by_email");
        claim = res.data;
      } catch (err) {
        console.warn("initial claim failed", err);
      }

      // If employee is linked, go straight to timesheets
      if (claim?.claimed || claim?.already_linked) {
        location.replace("/timesheet.html");
        return;
      }

      // Also check if user already has an employee record
      try {
        const { data } = await sb.from("users").select("id").eq("auth_user_id", session.user.id).maybeSingle();
        if (data) {
          location.replace("/timesheet.html");
          return;
        }
      } catch {}

      // Not linked — show the unlinked message
      document.getElementById("unlinked-card").style.display = "";
      document.getElementById("unlinked-email").textContent = session.user.email || "your email";
    </script>
  </body>
</html>
