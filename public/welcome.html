<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Welcome · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="preconnect" href="https://swpxduxnjimsxtfpyxur.supabase.co" crossorigin />
    <link rel="modulepreload" href="/js/welcome.js" />
    <link rel="modulepreload" href="/js/shared.js" />
    <link rel="modulepreload" href="/js/supabase-client.js" />
    <link rel="modulepreload" href="/js/vendor/supabase-js.js" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <span class="brand">
            <span class="brand-logo" aria-label="PTL">ptl</span>
            <span class="brand-name">Timesheet</span>
          </span>
        </div>
        <span></span>
        <div class="row-flex ready">
          <span id="whoami" class="who"></span>
          <button type="button" id="signout-link" class="topbar-signout">Sign out</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <div class="card" id="unlinked-card" style="display:none">
        <h2>Almost there</h2>
        <p>
          Your account is signed in, but you're not on the employee roster
          yet. Ask your admin to add you to PTL Timesheet using the email
          <strong id="unlinked-email"></strong>, then refresh this page.
        </p>
        <div class="row-flex" style="gap:8px">
          <button id="refresh-link" class="ghost">Try again</button>
          <button id="signout-card-btn" class="danger">Sign out</button>
        </div>
      </div>
    </main>

    <script type="module" src="/js/welcome.js"></script>
  </body>
</html>
