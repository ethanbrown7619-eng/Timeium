<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#BEFA40" />
    <title>Welcome · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/img/ptl-logo.png" class="brand-logo" alt="PTL" />
        <span class="brand-name">Timesheet</span>
      </div>
      <div class="grow"></div>
      <div class="row-flex">
        <span id="whoami" class="who"></span>
        <a href="#" id="signout-link" class="muted">Sign out</a>
      </div>
    </header>

    <main class="container">
      <div id="notice" class="notice hidden"></div>

      <div class="card" id="unlinked-card" style="display:none">
        <h2>Almost there</h2>
        <p>
          Your account is signed in, but you're not on the employee roster
          yet. Ask your admin to add you to PTL Timesheet using the email
          <strong id="unlinked-email"></strong>, then refresh this page.
        </p>
        <button id="refresh-link" class="ghost">Try again</button>
      </div>
    </main>

    <script type="module" src="/js/welcome.js"></script>
  </body>
</html>
