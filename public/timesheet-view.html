<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c2ff00" />
    <title>View Timesheet · PTL Timesheet</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container ts-container">
      <div id="notice" class="notice hidden"></div>

      <div class="row-flex mb-md">
        <a href="/department.html" class="ghost" id="back-link">← Back to My Departments</a>
        <div class="grow"></div>
        <button id="admin-edit-btn" class="ghost hidden">Edit (admin)</button>
        <span id="ts-view-status" class="muted small"></span>
      </div>

      <h2 id="view-title" style="margin:0 0 4px">Timesheet</h2>
      <p class="muted mb-md" id="view-subtitle"></p>

      <div class="card ts-container-inner">
        <div class="ts-grid-scroll">
          <table class="ts-grid">
          <thead>
            <tr>
              <th class="col-job">Job</th>
              <th class="col-status">Status</th>
              <th class="col-dept">Dept</th>
              <th class="col-task">Task</th>
              <th class="col-desc">Description</th>
              <th class="day-col">Mon</th>
              <th class="day-col">Tue</th>
              <th class="day-col">Wed</th>
              <th class="day-col">Thu</th>
              <th class="day-col">Fri</th>
              <th class="day-col day-weekend">Sat</th>
              <th class="day-col day-weekend">Sun</th>
              <th class="col-total">Total</th>
            </tr>
            <tr id="date-row" class="small muted"></tr>
          </thead>
          <tbody id="view-body">
            <tr><td colspan="13" class="muted small" style="text-align:center">Loading…</td></tr>
          </tbody>
          <tfoot>
            <tr id="totals-row">
              <td colspan="5" style="text-align:right"><strong>Daily totals</strong></td>
              <td class="day-col" id="total-mon">0</td>
              <td class="day-col" id="total-tue">0</td>
              <td class="day-col" id="total-wed">0</td>
              <td class="day-col" id="total-thu">0</td>
              <td class="day-col" id="total-fri">0</td>
              <td class="day-col day-weekend" id="total-sat">0</td>
              <td class="day-col day-weekend" id="total-sun">0</td>
              <td class="day-col" id="total-week"><strong>0</strong></td>
            </tr>
            <tr id="overtime-row" style="display:none">
              <td colspan="5" style="text-align:right"><strong>Overtime</strong></td>
              <td class="day-col" id="ot-mon"></td>
              <td class="day-col" id="ot-tue"></td>
              <td class="day-col" id="ot-wed"></td>
              <td class="day-col" id="ot-thu"></td>
              <td class="day-col" id="ot-fri"></td>
              <td class="day-col day-weekend" id="ot-sat"></td>
              <td class="day-col day-weekend" id="ot-sun"></td>
              <td class="day-col" id="ot-week"><strong></strong></td>
            </tr>
          </tfoot>
        </table>
        </div>

        <div class="row-flex mt-md" id="approve-bar" style="display:none">
          <button class="ghost" id="reject-btn">Reject</button>
          <div class="grow"></div>
          <button id="approve-btn" class="primary">Approve timesheet</button>
        </div>

        <div class="row-flex mt-md" id="admin-submit-bar" style="display:none">
          <div class="grow"></div>
          <button id="admin-submit-btn" class="primary">Submit on behalf</button>
        </div>
      </div>
    </main>

    <script type="module" src="/js/timesheet-view.js"></script>
  </body>
</html>
