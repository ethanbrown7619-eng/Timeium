# Deploys the Worker (script + static assets from ./public) straight from
# GitHub's runners with wrangler — completely bypassing Cloudflare's
# Workers Builds pipeline, which hung at "Initializing" indefinitely.
#
# Requires two repository secrets (GitHub → Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers"
#                            template (dash.cloudflare.com → My Profile →
#                            API Tokens → Create Token)
#   CLOUDFLARE_ACCOUNT_ID  — shown on the Workers & Pages overview page
name: Deploy to Cloudflare

# Manual-only: Cloudflare's git builds recovered, so this is a break-glass
# fallback for the next time Workers Builds hangs — trigger it from the
# GitHub Actions tab (needs the two secrets described above).
on:
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
